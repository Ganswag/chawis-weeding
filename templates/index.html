      <style>
        @font-face {
          font-family: Washington;
          src: url({% static 'fonts/Washington-Regular.ttf' %});
        }

        :root {
          --color-white: hsla(0, 0%, 100%, 1);
          --color-black: hsla(0, 0%, 0%, 1);
          font-family: Washington;
        }

      .main {
        max-width: 100vw;
        overflow-x: hidden;
        font-family: Washington;
      }
      .parallax {
        /* Set a specific height */
        min-height: 100vh; 

        /* Create the parallax scrolling effect */
        background-attachment: fixed;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .hero-reveal {
        background-color: var(--color-black);
        position: relative;
        min-height: 100vh !important;
      }

      .hero-reveal-header {
        align-items: center;
        background-color: var(--color-white);
        color: var(--color-black);
        display: flex;
        font-size: clamp(3.125rem, 12.61vw + -0.138rem, 15.625rem);
        line-height: clamp(4.688rem, 15.763vw + 0.609rem, 20.313rem);
        font-weight: 900;
        justify-content: center;
        left: 0;
        min-height: 100vh;
        position: relative;
        top: 0;
        will-change: transform;
        z-index: 1;
      }

      .hero-reveal-split {
        align-items: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        position: relative;
        width: 100%;
      }

      .hero-reveal-split-item {
        align-items: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
        width: 100%;

        &:nth-child(1) {
          -webkit-clip-path: inset(0 0 calc(50% - 1px) 0);
          clip-path: inset(0 0 calc(50% - 1px) 0);
        }

        &:nth-child(2) {
          -webkit-clip-path: inset(calc(50% - 1px) 0 0 0);
          clip-path: inset(calc(50% - 1px) 0 0 0);
          left: 0;
          position: absolute;
          top: 0;
        }
      }



#content {
    position: relative;
    display: block;

    .content__img {
        max-width: none;
    }

    section {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .section-three {
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        height: 90vh;
        min-height: 1000px;

        @media only screen and (min-width: 1440px) {
            height: 150vh;
        }

        .dmslt2 {
            filter: url(#sandy2);
        }

        .container {
            width: 1000px;
            display: grid;
            grid-template-columns: repeat(2, [col-start] 1fr);
            grid-template-rows: auto auto auto;
            color: #f1d7ff;

            .title-top {
                grid-column: 1/2;
                grid-row: 1/2;
                display: block;
                top: 259px;
                left: 122px;
                position: relative;
                mix-blend-mode: color-dodge;

                p {
                    color: #fff;
                    font-size: 100px;
                    margin: 0;
                    padding: 0;
                    color: rgb(184, 82, 54);
                    mix-blend-mode: color-dodge;
                }
            }

            .content__img {
                grid-column: 1/3;
                grid-row: 2/3;
                display: block;
                margin: auto;
            }

            .text-bottom-left {
              grid-column: 1/2;
              grid-row: 3/4;
              display: block;
              padding-top: 1rem;
              padding-right: 100px;
              text-transform: uppercase;
            }

            .text-bottom-right {
                grid-column: 2/3;
                grid-row: 3/4;
                display: block;
                justify-self: start;
                top: -224px;
                right: 175px;
                position: relative;
                p {
                    color: #fff;
                    font-size: 28px;
                    margin: 0;
                    padding: 0;
                }
            }
        }
    }
}


.rose-text {
    color: rgb(184, 82, 54) !important;
  filter: drop-shadow(0px 0px 1px #bd487e);

    <script>

gsap.registerPlugin(ScrollTrigger, ScrollSmoother, SplitText);

ScrollSmoother.create({
  smooth: 1,
  effects: true,
  normalizeScroll: true,
  wholePixels: true // fix black line glitch issue
});

const heroReveal = gsap.utils.toArray(".hero-reveal");
heroReveal.forEach((element) => {
  const heroBox = element.querySelector(".hero-reveal-header");
  const heroHeadings = element.querySelectorAll(".hero-reveal-split-item");
  const contentEl = element.querySelector(".hero-reveal-content");

  const heroBoxHeight = heroBox.offsetHeight;
  const contentHeight = contentEl.offsetHeight;

  // Content scroll up
  gsap
    .timeline({
      scrollTrigger: {
        trigger: element,
        start: "top top",
        end: `+=${
          heroBoxHeight > contentHeight ? heroBoxHeight : contentHeight
        }`,
        scrub: true
      }
    })
    .fromTo(contentEl, { y: "50%" }, { y: "0%", ease: "none" }, 0.2);

  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: element,
      start: "top top",
      end: `+=${heroBoxHeight > contentHeight ? heroBoxHeight : contentHeight}`,
      scrub: true,
      pin: true
    }
  });

  // Main clipPath animation
  tl.fromTo(
    heroBox,
    {
      clipPath:
        "polygon(0 0, 100% 0, 100% 50%, 0 50%, 0 50%, 100% 50%, 100% 100%, 0 100%)"
    },
    {
      clipPath:
        "polygon(0 0, 100% 0, 100% 0%, 0 0%, 0 100%, 100% 100%, 100% 100%, 0 100%)",
      duration: 0.4,
      ease: "power4.inOut"
    }
  );

  // Split animations for child items
  if (heroHeadings.length < 2) return;

  tl.fromTo(
    heroHeadings[0],
    { y: "0%" },
    { y: "-30%", ease: "power3.inOut" },
    0
  );

  tl.fromTo(
    heroHeadings[1],
    { y: "0%" },
    { y: "30%", ease: "power3.inOut" },
    0
  );
});

// Alice animation
function parallaxScrollBySpeed(selector, speed = 1, trigger = ".hero-reveal") {
  const el = document.querySelector(selector);
  const contentEl = document.querySelector(".hero-reveal-content");
  const contentHeight = contentEl.offsetHeight;

  if (!el) return;

  gsap.to(el, {
    yPercent: (speed - 1) * 100,
    ease: "none",
    scrollTrigger: {
      trigger,
      start: "top top",
      end: `+=${contentHeight * 3}`,
      scrub: true
    }
  });
}

gsap.to(".dmslt2", {
    scrollTrigger: {
        trigger: ".container-two",
        // markers: true,
        start: "10% 55%",
        // end: "60%",
        scrub: 20,
        toggleActions: "play none reverse none"
    },
    r: 1000
});

gsap.to(".title-top", {
    scrollTrigger: {
        trigger: ".container-two",
        // markers: true,
        start: "top center",
        end: "60% center",
        scrub: true,
        toggleActions: "play none none none"
    },
    left: 0,
    top: 20
});

gsap.to(".text-bottom-right", {
    scrollTrigger: {
        trigger: ".container-two",
        // markers: true,
        start: "top center",
        end: "60% center",
        scrub: true,
        toggleActions: "play none none none"
    },
    right: 48,
    top: 0
});

let scrollText = document.querySelector(".scroll-text");

gsap.to(scrollText, {
    duration: 1,
    repeat: -1,
    yoyo: true,
    repeatDelay: 2,
    text: {
        value: "Slowly",
        newClass: "rose-text"
    }
});

const quotes = document.querySelectorAll(".quote");

function setupSplits() {
  quotes.forEach(quote => {

    quote.split = new SplitText(quote, { 
      type: "lines,words,chars",
      linesClass: "split-line"
    });

    // Set up the anim
    quote.anim = gsap.from(quote.split.lines, {
      scrollTrigger: {
        trigger: quote,
        toggleActions: "restart pause resume reverse",
        start: "10% 80%",
        end: "50%",
        // markers: true,
      },
      duration: 0.6, 
      ease: "circ.out", 
      yPercent: 100, 
      stagger: 0.2,
    });
  });
}

setupSplits();
