    <style>
      @font-face {
        font-family: Washington;

      :root {
        --color-white: hsla(0, 0%, 100%, 1);

        font-family: Washington;
      }

    .main {
      max-width: 100vw;
      overflow-x: hidden;
      font-family: Washington;
    }

    .hero-reveal {
      background-color: var(--color-black);
      position: relative;
      min-height: 100vh !important;
    }

    .hero-reveal-header {
      align-items: center;
      background-color: var(--color-white);
      color: var(--color-black);
      display: flex;
      font-size: clamp(3.125rem, 12.61vw + -0.138rem, 15.625rem);
      line-height: clamp(4.688rem, 15.763vw + 0.609rem, 20.313rem);
      font-weight: 900;
      justify-content: center;
      left: 0;
      min-height: 100vh;
      position: relative;
      top: 0;
      will-change: transform;
      z-index: 1;
    }

    .hero-reveal-split {
      align-items: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      width: 100vw;
    }

    .hero-reveal-split-item {
      align-items: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
      width: 100%;

      &:nth-child(1) {
        -webkit-clip-path: inset(0 0 calc(50% - 1px) 0);
        clip-path: inset(0 0 calc(50% - 1px) 0);
      }

      &:nth-child(2) {
        -webkit-clip-path: inset(calc(50% - 1px) 0 0 0);
        clip-path: inset(calc(50% - 1px) 0 0 0);
        left: 0;
        position: absolute;
        top: 0;
      }
    }

  <script>

gsap.registerPlugin(ScrollTrigger, ScrollSmoother, SplitText, ScrollToPlugin); 

ScrollSmoother.create({
  smooth: 1,
  effects: true,
  normalizeScroll: true,
  wholePixels: true // fix black line glitch issue
});

const heroReveal = gsap.utils.toArray(".hero-reveal");
heroReveal.forEach((element) => {
  const heroBox = element.querySelector(".hero-reveal-header");
  const heroHeadings = element.querySelectorAll(".hero-reveal-split-item");
  const contentEl = element.querySelector(".hero-reveal-content");

  const heroBoxHeight = heroBox.offsetHeight;
  const contentHeight = contentEl.offsetHeight;

  // Content scroll up
  gsap
    .timeline({
      scrollTrigger: {
        trigger: element,
        start: "top top",
        end: `+=${
          heroBoxHeight > contentHeight ? heroBoxHeight : contentHeight
        }`,
        scrub: true
      }
    })
    .fromTo(contentEl, { y: "50%" }, { y: "0%", ease: "none" }, 0.2);

  const tl = gsap.timeline({
    scrollTrigger: {
      trigger: element,
      start: "top top",
      end: `+=${heroBoxHeight > contentHeight ? heroBoxHeight : contentHeight}`,
      scrub: true,
      pin: true
    }
  });

  // Main clipPath animation
  tl.fromTo(
    heroBox,
    {
      clipPath:
        "polygon(0 0, 100% 0, 100% 50%, 0 50%, 0 50%, 100% 50%, 100% 100%, 0 100%)"
    },
    {
      clipPath:
        "polygon(0 0, 100% 0, 100% 0%, 0 0%, 0 100%, 100% 100%, 100% 100%, 0 100%)",
      duration: 0.4,
      ease: "power4.inOut"
    }
  );

  // Split animations for child items
  if (heroHeadings.length < 2) return;

  tl.fromTo(
    heroHeadings[0],
    { y: "0%" },
    { y: "-30%", ease: "power3.inOut" },
    0
  );

  tl.fromTo(
    heroHeadings[1],
    { y: "0%" },
    { y: "30%", ease: "power3.inOut" },
    0
  );
});

gsap.to(".title-top", {

});

gsap.to(".text-bottom-right", {
    scrollTrigger: {
        trigger: ".container-two",
        // markers: true,
        start: "top center",
        end: "60% center",
        scrub: true,
        toggleActions: "play none none none"
    },
    right: 48,
    top: 0
});

const quotes = document.querySelectorAll(".quote");

function setupSplits() {
  quotes.forEach(quote => {

    quote.split = new SplitText(quote, { 
      type: "lines,words,chars",
      linesClass: "split-line"
    });

    // Set up the anim
    quote.anim = gsap.from(quote.split.lines, {
      scrollTrigger: {
        trigger: quote,
        toggleActions: "restart pause resume reverse",
        start: "10% 80%",
        end: "50%",
        // markers: true,
      },
      duration: 0.6, 
      ease: "circ.out", 
      yPercent: 100, 
      stagger: 0.2,
    });
  });
}
document.fonts.ready.then(() => {
  setupSplits();
});

    </script>


<script>
  
  

function goToGifts() {
  document.getElementById("regalos").scrollIntoView({behavior: 'smooth'});
}

function goToConfirm() {
  document.getElementById("confirm").scrollIntoView({behavior: 'smooth'});
}

// Set the date we're counting down to
var countDownDate = new Date("Jun 13, 2026 16:00:00").getTime();

// Update the count down every 1 second
var x = setInterval(function() {

  // Get today's date and time
  var now = new Date().getTime();

  // Find the distance between now and the count down date
  var distance = countDownDate - now;

  // Time calculations for days, hours, minutes and seconds
  var days = Math.floor(distance / (1000 * 60 * 60 * 24));
  var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  var seconds = Math.floor((distance % (1000 * 60)) / 1000);

  // Display the result in the element with id="demo"
  document.getElementById("reverse-counter").innerHTML = days + "d " + hours + "h "
  + minutes + "m " + seconds + "s ";

  // If the count down is finished, write some text
  if (distance < 0) {
    clearInterval(x);
    document.getElementById("demo").innerHTML = "EXPIRED";
  }
}, 1000);
</script>
